# dsh-api-relay-bridge 的示例 patch 片段。
#
# 用法：把下面需要的内容合并进你的 profile patch 文件——
#   Windows:        %USERPROFILE%\.dsh\profiles\<profile>\cordis.patch.yml
#   macOS / Linux:  ~/.dsh/profiles/<profile>/cordis.patch.yml
# 然后完全重启 DSH。

# 1) 把 provider 的 baseURL 从中转站直连改成代理监听地址。
#    这里只示意两个：a（Claude）与 v（DeepSeek）。你的 providers 键名可能不同。
#    如果你的 profile 里**已经有** llm-pi-ai 条目，请直接改那一条里的 baseURL，
#    不要新增第二条同名条目（容易看混，也难判断哪份生效）。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      a:
        displayName: Claude Sonnet 5.5
        apiKeyEnv: A_API_KEY
        api: anthropic-messages
        baseURL: http://127.0.0.1:8790        # ← 原来是中转站直连地址
        models:
          - id: claude-sonnet-5-5
            name: claude-sonnet-5-5
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              max: max
      v:
        displayName: DeepSeek V4.1 Flash
        apiKeyEnv: V_API_KEY
        api: anthropic-messages
        baseURL: http://127.0.0.1:8790        # ← 原来是中转站直连地址
        models:
          - id: DeepSeek-V4.1-Flash
            name: DeepSeek-V4.1-Flash
            input:
              - text
            reasoningEfforts:
              off: null
              max: max

# 2) 可选：覆盖插件自己的默认配置（bundle 里的 cordis.patch.yml 已给了一份）。
#    这一层优先级高于 bundle 默认值，低于面板保存的运行时覆盖（config.json）。
- id: dsh-api-relay-bridge
  config:
    enabled: true
    port: 8790
    upstream: https://your-relay.example.com   # ← 填你自己的中转站地址
    mode: move              # move = 折叠后清空 system；copy = 保留一份（对照实验）
    targets: []             # fetch 兜底只改写这些主机（等值或子域）；默认关闭
    audit: true
    verbose: false
